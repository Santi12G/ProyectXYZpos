<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ventas - XYZpos</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-[#0f0f13] text-slate-200 min-h-screen p-4 md:p-8">
<header class="flex flex-wrap justify-between gap-4"><h1 class="text-2xl text-orange-500">Ventas · {{ request.user.username }}</h1><nav>{% if es_admin %}<a href="{% url 'dashboard_ui' %}">Dashboard</a> · <a href="{% url 'inventario' %}">Inventario</a>{% endif %}<form method="post" action="{% url 'logout' %}" class="inline ml-4">{% csrf_token %}<button>Salir</button></form></nav></header>
<main class="max-w-5xl mx-auto mt-8 space-y-5"><p id="sale-message" role="status" class="text-orange-300 whitespace-pre-line"></p>
<form id="sale-form" class="bg-[#1a1a22] border border-gray-800 rounded-xl p-5 space-y-4">{% csrf_token %}<h2 id="sale-title">Nueva venta en borrador</h2><p>Los precios y el stock se vuelven a comprobar al confirmar.</p><div id="sale-lines" class="space-y-3"></div>
<button type="button" id="add-line" class="text-orange-400">Añadir producto</button><div class="flex flex-wrap gap-4"><label>Pago <select id="payment-method" class="bg-slate-800 p-2"><option value="CASH">Efectivo</option><option value="CARD">Tarjeta</option><option value="TRANSFER">Transferencia</option></select></label><label>Recibido (opcional) <input id="amount-received" type="number" min="0" step="0.01" class="bg-slate-800 p-2"></label></div>
<button class="bg-orange-600 rounded p-3">Guardar borrador</button><button type="button" id="new-sale" class="p-3">Nueva venta</button></form>
<h2 class="text-xl">Ventas recientes y en espera</h2><div id="sale-list" class="space-y-3"></div></main>
<template id="line-template"><div class="flex gap-2 flex-wrap"><select aria-label="Producto" class="bg-slate-800 p-2 flex-1" required>{% for p in productos %}<option value="{{ p.pk }}">{{ p.sku }} · {{ p.nombre }} · ${{ p.precio }} · stock {{ p.stock }}</option>{% endfor %}</select><input aria-label="Cantidad" class="bg-slate-800 p-2 w-24" type="number" min="1" step="1" value="1" required><button type="button" class="text-red-300">Quitar</button></div></template>
<script>
let editing = null; const message = document.getElementById('sale-message'), lines = document.getElementById('sale-lines');
const csrf = document.querySelector('#sale-form [name=csrfmiddlewaretoken]').value;
async function api(path, method='GET', data) { const response = await fetch(`/api/ventas/${path}`, {method, headers:{'Content-Type':'application/json','X-CSRFToken':csrf}, body:data === undefined ? undefined : JSON.stringify(data)}); const result = await response.json(); if (!response.ok) throw new Error(JSON.stringify(result)); return result; }
function addLine(item) { const row = document.getElementById('line-template').content.firstElementChild.cloneNode(true); if (item) { row.querySelector('select').value = item.product; row.querySelector('input').value = item.quantity; } row.querySelector('button').onclick = () => row.remove(); lines.append(row); }
document.getElementById('add-line').onclick = () => addLine();
function reset() { editing = null; lines.replaceChildren(); addLine(); document.getElementById('sale-title').textContent='Nueva venta en borrador'; document.getElementById('amount-received').value=''; }
document.getElementById('new-sale').onclick = reset;
async function refresh() { const sales = await api(''); const list = document.getElementById('sale-list'); list.replaceChildren(); for (const sale of sales) { const card = document.createElement('article'); card.className='bg-slate-800 rounded p-4'; const text = document.createElement('p'); text.textContent=`${sale.receipt_number} · ${sale.status} · ${sale.status === 'DRAFT' ? 'Total pendiente de confirmar' : '$'+sale.total}`; card.append(text); if (sale.status === 'DRAFT') { for (const [label, action] of [['Recuperar','edit'],['Confirmar','completar'],['Cancelar','cancelar']]) { const button = document.createElement('button'); button.type='button'; button.className='mr-4 mt-3 text-orange-300'; button.textContent=label; button.onclick=async () => { button.disabled=true; try { if (action === 'edit') { const draft = await api(`${sale.id}/`); editing=draft.id; lines.replaceChildren(); draft.items.forEach(addLine); document.getElementById('sale-title').textContent=`Editar ${draft.receipt_number}`; document.getElementById('payment-method').value=draft.payment_method; document.getElementById('amount-received').value=draft.amount_received ?? ''; } else { const result=await api(`${sale.id}/${action}/`, 'POST', {}); message.textContent=`${result.status} · Total $${result.total} · Cambio ${result.change_amount ?? 'no aplica'}`; await refresh(); } } catch(error) { message.textContent=error.message; } finally { button.disabled=false; } }; card.append(button); } } list.append(card); } }
document.getElementById('sale-form').onsubmit=async event => { event.preventDefault(); const button=event.target.querySelector('button:not([type=button])'); button.disabled=true; try { const items=[...lines.children].map(row=>({product:Number(row.querySelector('select').value),quantity:Number(row.querySelector('input').value)})); const result=await api(editing ? `${editing}/` : '', editing ? 'PUT' : 'POST', {items,payment_method:document.getElementById('payment-method').value,amount_received:document.getElementById('amount-received').value || null}); message.textContent=`Borrador guardado: ${result.receipt_number}`; reset(); await refresh(); } catch(error) { message.textContent=error.message; } finally { button.disabled=false; } };
reset(); refresh().catch(error=>{message.textContent=error.message;});
</script></body></html>
