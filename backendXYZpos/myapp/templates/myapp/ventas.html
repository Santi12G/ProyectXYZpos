<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ventas - XYZpos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f0f13] text-slate-200 min-h-screen p-4 md:p-8">
    <header class="flex flex-wrap justify-between gap-4">
        <h1 class="text-2xl text-orange-500 font-bold">Ventas · {{ request.user.username }}</h1>
        <nav class="flex items-center gap-4">
            {% if es_admin %}
                <a href="{% url 'dashboard_ui' %}" class="hover:text-orange-400 transition-colors">Dashboard</a> · 
                <a href="{% url 'inventario' %}" class="hover:text-orange-400 transition-colors">Inventario</a>
            {% endif %}
            <form method="post" action="{% url 'logout' %}" class="inline ml-2">
                {% csrf_token %}
                <button class="bg-red-600/80 hover:bg-red-600 text-white px-3 py-1 rounded transition-all transform active:scale-95">Salir</button>
            </form>
        </nav>
    </header>

    <main class="max-w-5xl mx-auto mt-8 space-y-5">
        <p id="sale-message" role="status" class="transition-all"></p>

        <form id="sale-form" class="bg-[#1a1a22] border border-gray-800 rounded-xl p-5 space-y-4 shadow-lg">
            {% csrf_token %}
            <h2 id="sale-title" class="text-lg font-semibold text-orange-400">Nueva Venta</h2>
            <p class="text-sm text-gray-400">Selecciona los productos. El inventario se descontará automáticamente.</p>
            
            <div id="sale-lines" class="space-y-3"></div>

            <button type="button" id="add-line" class="text-orange-400 hover:text-orange-300 hover:underline transition-colors font-medium">+ Añadir producto</button>
            
            <div class="flex flex-wrap gap-4 pt-2">
                <label class="flex flex-col text-sm text-gray-300">Pago 
                    <select id="payment-method" name="payment_method" class="bg-slate-800 border border-gray-700 p-2 rounded mt-1 focus:outline-none focus:border-orange-500">
                        <option value="CASH">Efectivo</option>
                        <option value="CARD">Tarjeta</option>
                        <option value="TRANSFER">Transferencia</option>
                    </select>
                </label>
                <label class="flex flex-col text-sm text-gray-300">Recibido (opcional) 
                    <input id="amount-received" name="amount_received" type="number" min="0" step="0.01" class="bg-slate-800 border border-gray-700 p-2 rounded mt-1 focus:outline-none focus:border-orange-500">
                </label>
            </div>

            <div class="flex flex-wrap gap-3 pt-3">
                <button type="submit" id="btn-instant" class="bg-green-600 hover:bg-green-500 active:bg-green-700 text-white font-medium rounded px-5 py-2.5 transition-all transform active:scale-95 shadow-md">Vender</button>
                <button type="submit" id="btn-draft" class="bg-orange-600 hover:bg-orange-500 active:bg-orange-700 text-white font-medium rounded px-5 py-2.5 transition-all transform active:scale-95 shadow-md">Guardar borrador</button>
                <button type="button" id="btn-reset" class="bg-slate-700 hover:bg-slate-600 active:bg-slate-800 text-gray-200 font-medium rounded px-5 py-2.5 transition-all transform active:scale-95 shadow-md">Limpiar</button>
            </div>
        </form>

        <h2 class="text-xl font-semibold text-gray-300 pt-2">Ventas recientes y en espera</h2>
        <div id="sale-list" class="space-y-3"></div>
    </main>

    <template id="line-template">
        <div class="flex gap-2 flex-wrap items-center bg-slate-900/50 p-3 rounded-lg border border-gray-800">
            <!-- Añadido data-stock para validación visual rápida -->
            <select name="producto" aria-label="Producto" class="bg-slate-800 border border-gray-700 p-2 rounded flex-1 focus:outline-none focus:border-orange-500" required>
                {% for p in productos %}<option value="{{ p.pk }}" data-stock="{{ p.stock }}">{{ p.sku }} · {{ p.nombre }} · ${{ p.precio }} · stock {{ p.stock }}</option>{% endfor %}
            </select>
            <input name="cantidad" aria-label="Cantidad" class="bg-slate-800 border border-gray-700 p-2 rounded w-24 text-center focus:outline-none focus:border-orange-500" type="number" min="1" step="1" value="1" required>
            <button type="button" class="quitar-btn text-red-400 hover:text-red-300 hover:bg-red-950/30 px-3 py-2 rounded transition-colors font-medium">Quitar</button>
        </div>
    </template>

    <script>
    let editing = null; 
    let editingTax = '0.00';
    const message = document.getElementById('sale-message');
    const lines = document.getElementById('sale-lines');
    const csrfInput = document.querySelector('#sale-form [name=csrfmiddlewaretoken]');
    const csrf = csrfInput ? csrfInput.value : '';

    function showMsg(text, isError=false) {
        message.textContent = text;
        message.className = isError 
            ? "text-red-400 font-bold whitespace-pre-line p-3 bg-red-900/20 border border-red-500/30 rounded-lg" 
            : "text-green-400 font-bold whitespace-pre-line p-3 bg-green-900/20 border border-green-500/30 rounded-lg";
    }

    async function api(path, method='GET', data) { 
        const url = `/api/ventas/${path}`;
        const response = await fetch(url, {
            method, 
            headers: {'Content-Type':'application/json', 'X-CSRFToken': csrf}, 
            body: data === undefined ? undefined : JSON.stringify(data)
        }); 
        
        const text = await response.text();
        let result;
        try {
            result = JSON.parse(text);
        } catch(e) {
            throw new Error(`Fallo crítico del servidor (Error ${response.status}). Mira la consola.`);
        }

        if (!response.ok) { 
            throw new Error(result.detail || JSON.stringify(result)); 
        } 
        return result; 
    }

    function addLine(item) { 
        const template = document.getElementById('line-template');
        const row = template.content.firstElementChild.cloneNode(true); 
        row.dataset.discount = item?.discount ?? '0.00';
        if (item) { 
            row.querySelector('select').value = item.product; 
            row.querySelector('input').value = item.quantity; 
        } 
        row.querySelector('.quitar-btn').onclick = () => row.remove(); 
        lines.append(row); 
    }

    document.getElementById('add-line').onclick = () => addLine();

    function reset(keepMessage = false) { 
        editing = null; 
        editingTax = '0.00';
        lines.replaceChildren(); 
        addLine(); 
        document.getElementById('sale-title').textContent = 'Nueva Venta'; 
        document.getElementById('amount-received').value = ''; 
        document.getElementById('payment-method').value = 'CASH';
        
        if (!keepMessage) {
            message.textContent = '';
            message.className = '';
        }
    }

    // Botón de limpiar no hace submit, solo resetea el formulario
    document.getElementById('btn-reset').onclick = () => reset(false);

    async function refresh() { 
        const sales = await api(''); 
        const list = document.getElementById('sale-list'); 
        list.replaceChildren(); 
        for (const sale of sales) { 
            const card = document.createElement('article'); 
            card.className = 'bg-slate-800/80 border border-gray-700/50 rounded-lg p-4 shadow flex flex-wrap justify-between items-center'; 
            
            const text = document.createElement('p'); 
            text.className = 'font-medium';
            text.textContent = `${sale.receipt_number} · ${sale.status} · ${sale.status === 'DRAFT' ? 'Total pendiente' : '$'+sale.total}`; 
            card.append(text); 
            
            const actionsDiv = document.createElement('div');
            if (sale.status === 'DRAFT') { 
                for (const [label, action] of [['Recuperar','edit'],['Confirmar','completar'],['Cancelar','cancelar']]) { 
                    const button = document.createElement('button'); 
                    button.type = 'button'; 
                    button.className = 'ml-4 mt-2 sm:mt-0 text-orange-400 hover:text-orange-300 hover:underline transition-colors font-medium text-sm'; 
                    button.textContent = label; 
                    button.onclick = async () => { 
                        button.disabled = true; 
                        try { 
                            if (action === 'edit') { 
                                const draft = await api(`${sale.id}/`); 
                                editing = draft.id; 
                                editingTax = draft.tax;
                                lines.replaceChildren(); 
                                draft.items.forEach(addLine); 
                                document.getElementById('sale-title').textContent = `Editar ${draft.receipt_number}`; 
                                document.getElementById('payment-method').value = draft.payment_method; 
                                document.getElementById('amount-received').value = draft.amount_received ?? ''; 
                                showMsg(`Recuperaste el borrador ${draft.receipt_number} para editarlo.`);
                            } else { 
                                const result = await api(`${sale.id}/${action}/`, 'POST', {}); 
                                if (editing === sale.id) reset(true);
                                showMsg(`${result.status} · Total $${result.total} · Cambio $${result.change_amount ?? '0'}`); 
                                await refresh(); 
                            } 
                        } catch(error) { 
                            showMsg(error.message, true); 
                        } finally { 
                            button.disabled = false; 
                        } 
                    }; 
                    actionsDiv.append(button); 
                } 
            } 
            card.append(actionsDiv);
            list.append(card); 
        } 
    }

    document.getElementById('sale-form').onsubmit = async event => { 
        event.preventDefault(); 
        
        // Determinar qué botón activó el submit
        const submitter = event.submitter;
        const isInstantSale = submitter.id === 'btn-instant';

        submitter.disabled = true; 
        const originalText = submitter.textContent;
        submitter.textContent = "Procesando...";

        try { 
            const items = [...lines.children].map(row => {
                const select = row.querySelector('select');
                const option = select.options[select.selectedIndex];
                const qty = Number(row.querySelector('input').value);
                const stock = Number(option.dataset.stock);

                // Validación rápida en el frontend para evitar peticiones innecesarias
                if (!editing && qty > stock) {
                    throw new Error(`Stock insuficiente para ${option.text.split('·')[1].trim()}. Disponible: ${stock}`);
                }

                return {
                    product: Number(select.value),
                    quantity: qty,
                    discount: row.dataset.discount
                };
            }); 

            if (items.length === 0) throw new Error("Añade al menos un producto.");

            const data = {
                items,
                tax: editingTax,
                payment_method: document.getElementById('payment-method').value,
                amount_received: document.getElementById('amount-received').value || null
            };

            // 1. Siempre guardamos el borrador primero (aquí tu models.py ahora descuenta el stock)
            let result = await api(editing ? `${editing}/` : '', editing ? 'PUT' : 'POST', data); 
            
            // 2. Si el botón fue "Vender al instante", completamos la venta automáticamente
            if (isInstantSale) {
                result = await api(`${result.id}/completar/`, 'POST', {});
                reset(true); 
                showMsg(`Venta completada. Total $${result.total} · Cambio $${result.change_amount ?? '0'}`);
            } else {
                // Si fue solo "Guardar borrador"
                reset(true); 
                showMsg(`Borrador ${result.receipt_number} guardado. Inventario separado exitosamente.`);
            }

            await refresh(); 
        } catch(error) { 
            showMsg(error.message, true); 
        } finally { 
            submitter.disabled = false; 
            submitter.textContent = originalText;
        } 
    };

    reset(); 
    refresh().catch(error => { showMsg(error.message, true); });
    </script>
</body>
</html>
