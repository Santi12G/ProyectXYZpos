<!doctype html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ titulo }} - XYZpos</title><script src="https://cdn.tailwindcss.com"></script><style>input,select,textarea{width:100%;background:#0f0f13;border:1px solid #374151;border-radius:.5rem;padding:.65rem;color:#fff}label{display:block;margin-bottom:.3rem;color:#9ca3af}</style></head>
<body class="bg-[#0f0f13] text-white min-h-screen p-8"><main class="max-w-3xl mx-auto bg-[#1a1a22] border border-gray-800 rounded-2xl p-8"><h1 class="text-2xl font-bold text-orange-500 mb-6">{{ titulo }}</h1><form method="post" class="grid md:grid-cols-2 gap-5">{% csrf_token %}<div role="alert" class="text-red-400 md:col-span-2">{{ form.non_field_errors }}</div>{% for field in form %}{% if field.is_hidden %}{{ field }}{% else %}<div class="{% if field.name == 'description' or field.name == 'image_url' %}md:col-span-2{% endif %}">{{ field.label_tag }}{{ field }}{% for error in field.errors %}<p class="text-red-400 text-sm">{{ error }}</p>{% endfor %}</div>{% endif %}{% endfor %}<div class="md:col-span-2 flex gap-3"><button class="bg-orange-600 px-5 py-2 rounded-lg">Guardar</button><a href="{% url 'inventario' %}" class="bg-gray-700 px-5 py-2 rounded-lg">Cancelar</a></div></form></main></body></html>
